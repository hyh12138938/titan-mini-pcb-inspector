<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="archTitle archDesc">
  <title id="archTitle">整机数据通路</title>
  <desc id="archDesc">OV5640 摄像头接入 RA8P1，经 Cortex-M85 与 Ethos-U55 处理后分别输出到 800x480 LCD、串口屏与云端；断网时改走 NPU 小模型与表驱动规则库。</desc>
  <defs>
    <marker id="tealArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/>
    </marker>
    <marker id="amberArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="560" fill="#fdfdfc"/>

  <!-- 输入 -->
  <rect x="56" y="200" width="190" height="96" rx="12" fill="#ffffff" stroke="#d6d3d1" stroke-width="1.4"/>
  <text x="151" y="238" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="16" font-weight="600" fill="#1f2937">OV5640</text>
  <text x="151" y="262" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#6b7280">320×240 · RGB888</text>

  <line x1="248" y1="248" x2="306" y2="248" stroke="#0f766e" stroke-width="1.8" marker-end="url(#tealArrow)"/>

  <!-- MCU -->
  <rect x="310" y="120" width="470" height="330" rx="16" fill="#f8fdfb" stroke="#99f6e4" stroke-width="1.6"/>
  <text x="545" y="152" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="15" font-weight="600" fill="#0f766e">R7KA8P1KFLC · RA8P1</text>

  <rect x="336" y="180" width="132" height="58" rx="8" fill="#ffffff" stroke="#cbd5d1" stroke-width="1.2"/>
  <text x="402" y="214" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" fill="#1f2937">Cortex-M85</text>

  <rect x="486" y="180" width="132" height="58" rx="8" fill="#ffffff" stroke="#cbd5d1" stroke-width="1.2"/>
  <text x="552" y="214" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" fill="#1f2937">Ethos-U55-256</text>

  <rect x="636" y="180" width="120" height="58" rx="8" fill="#ffffff" stroke="#cbd5d1" stroke-width="1.2"/>
  <text x="696" y="208" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#1f2937">SDRAM</text>
  <text x="696" y="224" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11" fill="#6b7280">32 MB</text>

  <rect x="336" y="254" width="132" height="58" rx="8" fill="#ffffff" stroke="#cbd5d1" stroke-width="1.2"/>
  <text x="402" y="288" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" fill="#1f2937">GLCDC</text>

  <rect x="486" y="254" width="132" height="58" rx="8" fill="#ffffff" stroke="#cbd5d1" stroke-width="1.2"/>
  <text x="552" y="288" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" fill="#1f2937">UART1</text>

  <rect x="636" y="254" width="120" height="58" rx="8" fill="#ffffff" stroke="#cbd5d1" stroke-width="1.2"/>
  <text x="696" y="288" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" fill="#1f2937">ETH</text>

  <!-- 降级分支 -->
  <rect x="336" y="332" width="420" height="88" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="546" y="362" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" font-weight="600" fill="#b45309">断网降级（不叫“本地大模型”）</text>
  <text x="546" y="386" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#92400e">NPU 分类模型（1 ms 级） + 表驱动规则库</text>
  <text x="546" y="406" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11" fill="#a16207">理由：32 MB SDRAM 装不下 LLM 权重</text>

  <!-- 输出 -->
  <line x1="780" y1="206" x2="846" y2="206" stroke="#0f766e" stroke-width="1.8" marker-end="url(#tealArrow)"/>
  <line x1="780" y1="296" x2="846" y2="296" stroke="#0f766e" stroke-width="1.8" marker-end="url(#tealArrow)"/>
  <line x1="780" y1="386" x2="846" y2="386" stroke="#0f766e" stroke-width="1.8" marker-end="url(#tealArrow)"/>

  <rect x="850" y="168" width="288" height="76" rx="12" fill="#ffffff" stroke="#d6d3d1" stroke-width="1.4"/>
  <text x="994" y="198" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" font-weight="600" fill="#1f2937">800×480 LCD</text>
  <text x="994" y="220" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#6b7280">画面 / 检测框 / 指标 · 不放菜单</text>

  <rect x="850" y="258" width="288" height="76" rx="12" fill="#ffffff" stroke="#d6d3d1" stroke-width="1.4"/>
  <text x="994" y="288" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" font-weight="600" fill="#1f2937">串口屏 HMI</text>
  <text x="994" y="310" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#6b7280">四模式键 / 结论 / 建议全文</text>

  <rect x="850" y="348" width="288" height="76" rx="12" fill="#ffffff" stroke="#d6d3d1" stroke-width="1.4"/>
  <text x="994" y="378" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" font-weight="600" fill="#1f2937">路由器 → 云端 API</text>
  <text x="994" y="400" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#6b7280">建议由云返回 · 单接口 advice_get()</text>

  <!-- 降级绕行 -->
  <path d="M546,420 L546,470 L1150,470 L1150,334" fill="none" stroke="#b45309" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#amberArrow)"/>
  <text x="700" y="492" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#b45309">探测连续失败 ×3 → 建议改由规则库给出，界面不感知来源</text>
</svg>
